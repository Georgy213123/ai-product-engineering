name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Поиск секретов (gitleaks, вся история)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .

  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Проверка сообщений коммитов PR
        run: |
          re='^(feat|fix|docs|test|refactor|perf|build|ci|chore|style|revert)(\([a-z0-9-]+\))?!?: .+'
          bad=0
          while read -r sha subject; do
            [[ "$subject" =~ $re ]] || { echo "✗ $sha $subject"; bad=1; }
          done < <(git log --format='%h %s' origin/${{ github.base_ref }}..HEAD --no-merges)
          exit $bad

  hook:
    name: Хук против секретов (shellcheck и тесты)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck ai-workflow/hooks/block-secrets.sh ai-workflow/hooks/tests/block-secrets.test.sh
      - name: Тесты хука
        run: bash ai-workflow/hooks/tests/block-secrets.test.sh
