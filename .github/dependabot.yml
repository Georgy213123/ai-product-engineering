version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: uv
    directory: /projects/01-sellerdesk/backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /projects/01-sellerdesk/frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /projects/01-sellerdesk/e2e
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups: { all: { patterns: ["*"] } }
  - package-ecosystem: uv
